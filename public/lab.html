<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<title>Lab | F5 Labs</title>
<link rel="stylesheet" href="/app.css?v=1119-1941">
</head>
<body>
<div class="lab">
  <div class="topbar">
    <div class="crumbs" id="crumbs">Loading...</div>
    <div class="who"><a href="/auth/logout">Sign out</a></div>
  </div>
  <div class="rotate"><h1>Turn your device sideways</h1><p>The lab needs a landscape screen.</p></div>
  <div class="cols">
    <section class="win" aria-label="Simulated device">
      <div class="banner" id="banner"></div>
      <div class="devhead" id="devhead"></div>
      <div class="mast">
        <div class="brand" id="brand"><img src="/logo.png" alt="Graham Mattingley, F5 Technologies Instructor"><span class="sim">LAB SIMULATOR</span></div>
        <ul class="status" id="status"></ul>
      </div>
      <div class="strip">
        <div class="mtabs"><span class="on">Main</span><span>Help</span><span>About</span></div>
        <div class="pathbar" id="pathbar"></div>
      </div>
      <div class="body">
        <nav class="nav" id="nav" aria-label="Device menu"></nav>
        <div class="device">
          <div class="tabs" id="tabsbar" hidden></div>
          <div class="devbar">
            <div id="devinfo"></div>
            <div id="althead" hidden></div>
            <div class="right"><span class="pending" id="pending" hidden>Changes not yet applied</span><button class="btn small" id="apply" type="button">Apply</button></div>
          </div>
          <div class="screen" id="screen"></div>
        </div>
      </div>
    </section>
    <aside class="lesson" aria-label="Lesson steps">
      <div class="head"><h2 id="ltitle"></h2><div class="req" id="lreqbox" hidden><b>Requirement</b><span id="lreq"></span></div><p id="lintro"></p></div>
      <div class="body">
        <div class="count" id="count"></div>
        <div class="bar"><div id="bar"></div></div>
        <ol class="steps" id="steps"></ol>
        <div class="tests" id="tests"></div>
        <div class="complete" id="complete" hidden>Lab complete. Well done.</div>
      </div>
      <div class="foot"><span><span id="saved"></span> <span class="build" id="build" data-build="1119-1941"></span></span><button class="btn small ghost" id="reset" type="button">Start again</button></div>
    </aside>
  </div>
</div>
<script src="/lab.js?v=1119-1941"></script>
</body>
</html>
