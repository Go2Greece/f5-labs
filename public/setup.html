<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<title>F5 Labs - setup check</title>
<style>
  body{font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;margin:0;background:#eceef2;color:#0a0e1c}
  main{max-width:560px;margin:12vh auto;padding:28px;background:#fff;border:1px solid #c3c7d1;border-radius:10px}
  h1{font-size:20px;margin:0 0 6px}
  p{margin:0 0 16px;color:#4b5160;font-size:14px}
  #status{font-size:16px;font-weight:600;padding:12px 14px;border-radius:8px;background:#e3e6ec}
  #status.ok{background:#e6f0fb;color:#14306e}
  #status.bad{background:#FDECEC;color:#8A1F1F}
  pre{font-size:12px;background:#eceef2;padding:12px;border-radius:8px;overflow:auto;margin:14px 0 0}
</style>
</head>
<body>
<main>
  <h1>F5 Labs</h1>
  <p>Setup check: the site is live. Testing the database connection.</p>
  <div id="status">Checking MongoDB Atlas...</div>
  <pre id="detail"></pre>
  <p style="margin-top:20px"><strong>Lab data.</strong> Loads the course and lab records into Atlas. Records already there are left unchanged. Admin only.</p>
  <button id="seed" type="button" style="padding:10px 16px;border-radius:8px;border:0;background:#1e3f8f;color:#fff;font-weight:600;cursor:pointer">Load lab data into Atlas</button>
  <button id="reseed" type="button" style="padding:10px 16px;border-radius:8px;border:1px solid #8A4205;background:#fff;color:#8A4205;font-weight:600;cursor:pointer;margin-left:8px">Replace with latest (development only)</button>
  <pre id="seedout"></pre>
  <p><a href="/">Front page</a></p>
</main>
<script>
fetch('/api/health').then(function(r){return r.json();}).then(function(d){
  var s=document.getElementById('status');
  s.className=d.ok?'ok':'bad';
  s.textContent=d.ok?'Database connected. Write and read both worked.':'Database not connected.';
  document.getElementById('detail').textContent=JSON.stringify(d,null,2);
}).catch(function(e){
  var s=document.getElementById('status');s.className='bad';s.textContent='Could not reach the Worker.';
  document.getElementById('detail').textContent=String(e);
});
function seed(q){
  var o=document.getElementById('seedout');o.textContent='Working...';
  fetch('/api/admin/seed'+q,{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){o.textContent=JSON.stringify(d,null,2);}).catch(function(e){o.textContent=String(e);});
}
document.getElementById('seed').addEventListener('click',function(){seed('');});
document.getElementById('reseed').addEventListener('click',function(){seed('?replace=1');});
</script>
</body>
</html>
